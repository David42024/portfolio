# .github/workflows/backup.yml
# Backup semanal de la base de datos de producción a Cloudflare R2.
#
# Secrets requeridos en GitHub (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL         cadena de conexión pooled de Supabase (producción)
#   R2_ACCOUNT_ID        id de cuenta Cloudflare (para endpoint S3)
#   R2_ACCESS_KEY_ID     token R2 (S3 API)
#   R2_SECRET_ACCESS_KEY secret R2 (S3 API)
#   R2_BUCKET            nombre del bucket R2
name: Backup Database

on:
  schedule:
    - cron: "0 3 * * 0" # domingo 03:00 UTC
  workflow_dispatch: # permite ejecutarlo manualmente desde Actions

permissions:
  contents: read

jobs:
  backup:
    name: Backup Supabase a R2
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      RETENTION_DAYS: 56 # 8 semanas

    steps:
      - name: Instalar cliente postgres y aws cli
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update

      - name: Dump de la base de datos
        run: |
          TS=$(date -u +%Y-%m-%dT%H%M%SZ)
          FILE="portfolio-${TS}.sql.gz"
          pg_dump "$DATABASE_URL" --no-owner --no-acl -Z 9 -f "$FILE"
          echo "DUMP_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Subir backup a R2
        run: |
          aws s3 cp "$DUMP_FILE" "s3://$R2_BUCKET/" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"

      - name: Retención (borra backups más antiguos que ${{ env.RETENTION_DAYS }} días)
        run: |
          KEEP=$(( RETENTION_DAYS * 86400 ))
          NOW=$(date -u +%s)
          ENDPOINT="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 ls "s3://$R2_BUCKET/" --endpoint-url "$ENDPOINT" | while read -r line; do
            NAME=$(echo "$line" | awk '{print $4}')
            DATE=$(echo "$line" | awk '{print $1}')
            TS=$(date -u -d "$DATE" +%s 2>/dev/null || echo 0)
            if [ "$TS" != "0" ] && [ $(( NOW - TS )) -gt "$KEEP" ]; then
              aws s3 rm "s3://$R2_BUCKET/$NAME" --endpoint-url "$ENDPOINT"
            fi
          done

      - name: Confirmar backup
        run: |
          echo "✅ Backup subido: $DUMP_FILE"
